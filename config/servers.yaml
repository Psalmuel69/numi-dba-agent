# =============================================================================
# Server registry (spec §10, §11 — server-level).
#
# You register SERVERS, not individual databases. The discovery crawler
# (numi.execution.discovery) enumerates the databases, schemas, tables,
# indexes, and available extensions on each one into the catalog, refreshed
# on a schedule.
#
# The security invariant is unchanged: the Agent can only target a server in
# this list, and a database/object discovery actually found on it. It can
# never name an arbitrary host or connection string.
#
# `allowed_roles`, `criticality`, `classification`, and `maintenance_window`
# apply to the whole server; `database_overrides` carries per-database
# exceptions for the few that need them.
#
# Credentials for `<id>` come from the secrets manager (SECRETS_PROVIDER),
# or config/dev_credentials.yaml when SECRETS_PROVIDER=local_dev. The
# diagnostic login should be least-privilege (VIEW SERVER STATE / pg_monitor,
# no SELECT on user tables — Numi never reads table data).
#
# Fake data only. Fictitious "core-banking" example mirrors the design spec.
# =============================================================================

servers:
  - id: sqlserver-dev-01
    platform: sqlserver
    environment: development
    # The compose-internal `mssql-sample` dummy container (docker compose
    # --profile mssql up -d mssql-sample), seeded by
    # scripts/seed_sqlserver_sample.sql — the real target
    # tests/e2e/test_live_databases.py exercises. From the host (rather
    # than another container) it's reachable at localhost:1433.
    host: mssql-sample
    port: 1433
    aliases: [dev-sql, sampledev]
    organization: platform-eng
    region: local
    criticality: low
    classification: internal
    owner: platform-eng
    support_team: platform-eng
    maintenance_window: { timezone: Africa/Lagos, start: "00:00", end: "23:59" }
    allowed_roles: [DBA_L1, DBA_L2, DBA_L3, DBA_MANAGER]
    status: active

