# =============================================================================
# Identity / authorization mapping (spec §3).
#
# This file NEVER contains real employees. It maps *enterprise identity
# provider groups* to application roles. In production this is backed by a
# real OIDC/AAD/Okta provider; the `directory` section below only exists to
# drive the local mock IdentityProvider for development and tests.
#
# Testing against a real channel (e.g. your own real Slack workspace) with
# your own real account: do NOT add yourself here. Instead create
# config/local_identity.yaml (gitignored, see
# config/local_identity.example.yaml for the template) — MockIdentityProvider
# automatically merges its mock_directory entries into this file's, so your
# real email/Slack id/etc. never reaches version control.
# =============================================================================

identity:
  # Any user who is a member of one of these groups is considered part of
  # the DBA team and may invoke @Numi at all. Group membership alone does
  # NOT grant any tool access — role mapping below determines that.
  groups:
    dba_team:
      - "Enterprise-DBA"

  roles:
    DBA_L1:
      groups:
        - "Enterprise-DBA-L1"
    DBA_L2:
      groups:
        - "Enterprise-DBA-L2"
    DBA_L3:
      groups:
        - "Enterprise-DBA-L3"
    DBA_MANAGER:
      groups:
        - "Enterprise-DBA-Managers"

# =============================================================================
# Real OIDC provider (IDENTITY_PROVIDER=oidc) — ignored entirely when
# IDENTITY_PROVIDER=mock, which is the default.
#
# A Slack/Teams webhook only ever hands us a channel-native account id (a
# Slack user id, an AAD object id) — there is no token to validate, so
# OIDCIdentityProvider resolves it with a SCIM 2.0 directory query:
#
#     GET <directory_endpoint>?filter=<attribute> eq "<account id>"
#
# `channel_attributes` is the real-directory analogue of each mock user's
# `channel_accounts` block below: instead of listing the ids per user, it
# says WHICH DIRECTORY ATTRIBUTE holds that channel's id, and asks the IdP.
# Populating that attribute is a directory-sync concern (SCIM provisioning
# from Slack/Teams, an HR feed, a scripted backfill) — no standard defines
# it, which is exactly why there is no built-in default: a channel with no
# attribute configured here resolves to None (fail closed) rather than
# guessing an attribute name and risking a wrong match.
#
# The `identity.groups` / `identity.roles` mapping above is shared verbatim
# with the mock — group -> role is always configuration, never code.
# -----------------------------------------------------------------------------
oidc:
  # SCIM 2.0 /Users endpoint of your IdP (Okta, Entra ID, Ping, ...).
  # Endpoint metadata for auth comes from OIDC discovery at OIDC_ISSUER;
  # SCIM's base URL is not published there, so it is set explicitly.
  directory_endpoint: ""
  channel_attributes: {}
  #   slack: "urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:slackUserId"
  #   teams: "externalId"      # AAD object id
  #
  # Attribute holding the user's group memberships (SCIM's own multi-valued
  # `groups`, or a flat list of names some IdPs project instead).
  groups_attribute: "groups"
  # Directory-asserted MFA enrollment. A chat message is not an
  # authentication event, so this reflects directory state, not a login;
  # anything other than an explicit affirmative reads as false.
  mfa_attribute: "mfaEnrolled"
  # OAuth scope requested for Numi's own client-credentials token.
  scopes: ""

# -----------------------------------------------------------------------------
# Mock directory — DEVELOPMENT / TEST ONLY.
#
# Maps a channel account (e.g. a Slack user id, or a Teams AAD object id) to
# a synthetic enterprise identity + group memberships. The real
# `OIDCIdentityProvider` never reads this section; it authenticates against
# a real IdP instead. Fictitious users only.
# -----------------------------------------------------------------------------
mock_directory:
  - subject_id: "dev-sub-l1-001"
    email: "dba.l1@example.test"
    display_name: "Dev DBA L1"
    channel_accounts:
      slack: "U_MOCK_L1"
      teams: "aad-mock-l1"
      dev: "dba_l1@example.com"
    groups: ["Enterprise-DBA", "Enterprise-DBA-L1"]
    mfa_satisfied: true

