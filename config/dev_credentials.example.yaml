# =============================================================================
# Template for config/dev_credentials.yaml (which is git-ignored).
#
#   cp config/dev_credentials.example.yaml config/dev_credentials.yaml
#
# Keyed by SERVER id (must match an entry in config/servers.yaml).
# `database` is the bootstrap/default database the connection opens against
# (master / postgres); Numi connects to specific discovered databases as
# needed. Read only when SECRETS_PROVIDER=local_dev.
#
# The login should be least-privilege for diagnostics — VIEW SERVER STATE +
# VIEW DEFINITION on SQL Server, the pg_monitor role on PostgreSQL — and
# should NOT have SELECT on user tables (Numi never reads table data).
#
# Optional per-entry `options`:
#   SQL Server:      trust_server_certificate: true   # dev servers w/ self-signed certs
#                    encrypt: false
#                    driver: "ODBC Driver 17 for SQL Server"
#   PostgreSQL:      sslmode: require
#   MySQL/MariaDB:   ssl: true
#
# Fake, non-routable values only in this template.
# =============================================================================

credentials:
  sqlserver-dev-01:
    # Matches docker-compose.yml's `mssql-sample` service exactly (the only
    # login it has is `sa`, since the seed script creates no other one).
    host: mssql-sample
    port: 1433
    username: sa
    password: Str0ng_Passw0rd!
    database: SampleCoreBanking
    options: { trust_server_certificate: true }

  sqlserver-uat-01:
    host: localhost
    port: 1434
    username: numi_diag
    password: change-me
    database: master
    options: { trust_server_certificate: true }

  corebanking-sqlserver-prod:
    host: localhost
    port: 1433
    username: numi_diag
    password: change-me
