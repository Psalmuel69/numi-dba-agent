[project]
name = "numi-dba-agent"
version = "0.1.0"
description = "Numi: Enterprise AI DBA Agent & Secure DBA Control Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  # `slack_interactive`'s `request.form()` (channels/api/app.py) needs this
  # at runtime to parse Slack's form-encoded `payload=...` body — Starlette
  # only asserts for it lazily on first form access, so its absence was
  # never caught by an import-time check, only by the interactive endpoint
  # itself 500ing on every real click (and, previously, by nothing in the
  # test suite either — no test exercised this endpoint's request body
  # parsing before the tests added here).
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "python-ulid>=2.7.0",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "sqlglot>=25.0.0",
  "cryptography>=42.0.0",
  "itsdangerous>=2.2.0",
  "PyJWT[crypto]>=2.8.0",
  # The Agent's once-daily proactive health digest (agent/scheduled_report.py)
  # — used for its AsyncIOScheduler + cron trigger. Chosen over a hand-rolled
  # `asyncio.sleep`-until-the-next-hour loop because the correctness of "every
  # day at 06:00 UTC" lives almost entirely in the edge cases a loop would have
  # to reimplement by hand (missed occurrences after a restart, overlapping
  # runs, drift, an explicit timezone) — here those are `misfire_grace_time` /
  # `max_instances` / `coalesce` / an explicitly-UTC trigger. No job store or
  # persistence is used: the schedule is configuration, not state.
  "apscheduler>=3.10",
  # Database drivers — the Execution Service always uses real connections.
  "pyodbc>=5.1.0",
  "psycopg[binary,pool]>=3.1.0",
  "asyncmy>=0.2.9",  # MySQL + MariaDB
  # LLM provider SDKs (spec §34). Each is only imported when that provider
  # is actually selected; a missing key simply makes the provider
  # unavailable rather than an import error.
  "anthropic>=0.39.0",
  "openai>=1.40.0",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
# Kept as an alias so existing `pip install -e ".[db-drivers]"` invocations
# still work; the drivers are now part of the base install.
db-drivers = []
# Secrets-manager SDKs (spec §19). One group per backend, and none of them
# in the base install: a deployment selects exactly one `SECRETS_PROVIDER`,
# so making all four unconditional would force every install to carry three
# unused cloud SDKs (and their transitive auth/crypto stacks). Each is
# imported lazily, inside the provider that needs it
# (`execution/credentials/provider.py`), exactly like the LLM provider SDKs
# above — so a Vault deployment never needs boto3 installed, and a missing
# package surfaces as a clear DEPENDENCY_UNAVAILABLE naming the extra
# rather than an import error at service startup.
secrets-vault = ["hvac>=2.0"]
secrets-aws = ["boto3>=1.34"]
secrets-azure = ["azure-keyvault-secrets>=4.8", "azure-identity>=1.17"]
secrets-gcp = ["google-cloud-secret-manager>=2.20"]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in a default argument is the framework's
# documented dependency-injection idiom, not a real "mutable default" bug.
# UP042: keeping `class X(str, Enum)` rather than `StrEnum` — these enums are
# used directly as Pydantic model fields / JSON schema sources across many
# modules, and standardizing that is a separate, deliberate refactor, not a
# lint fixup.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
