name: inumi

services:
  # --- Control plane -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inumi
      POSTGRES_PASSWORD: inumi
      POSTGRES_DB: inumi_control
    ports:
      - "5432:5432"
    volumes:
      - inumi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inumi -d inumi_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Sample "dummy" databases the agent can be pointed at ---------------
  # A ready-to-use PostgreSQL target so `docker compose up` gives a working
  # real-connection demo out of the box. Point config/dev_credentials.yaml's
  # `analytics-postgres-prod` entry at host `postgres-sample` (from a
  # container) or `localhost:5435` (from the host).
  postgres-sample:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev_readonly
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: sample_analytics
    ports:
      - "5435:5432"
    volumes:
      - ./scripts/seed_postgres_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_readonly -d sample_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in (heavy: ~1.5GB image, ~2GB RAM). Start with:
  #   docker compose --profile mssql up
  mssql-sample:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./scripts/seed_sqlserver_sample.sql:/seed/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Opt-in. Start with:  docker compose --profile mysql up -d mysql-sample
  mysql-sample:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: sample_app
      MYSQL_USER: inumi_diag
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/seed_mysql_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchange-me-root"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in. Start with:  docker compose --profile mariadb up -d mariadb-sample
  mariadb-sample:
    profiles: ["mariadb"]
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: change-me-root
      MARIADB_DATABASE: sample_app
      MARIADB_USER: inumi_diag
      MARIADB_PASSWORD: change-me
    ports:
      - "3307:3306"
    volumes:
      - ./scripts/seed_mysql_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services ----------------------------------------------
  migrate:
    build:
      context: .
    command: ["sh", "-c", "alembic upgrade head"]
    environment: &common-env
      INUMI_ENV: development
      CONTROL_DB_URL: postgresql+asyncpg://inumi:inumi@postgres:5432/inumi_control
      REDIS_URL: redis://redis:6379/0
      SECRETS_PROVIDER: local_dev
      IDENTITY_PROVIDER: mock
      POLICY_CONFIG_PATH: /app/config/policy.yaml
      SERVERS_CONFIG_PATH: /app/config/servers.yaml
      IDENTITY_CONFIG_PATH: /app/config/identity.yaml
      RATE_LIMIT_CONFIG_PATH: /app/config/rate_limits.yaml
      # "memory" (default) only counts within one process — fine for this
      # single-replica local stack. Set to "redis" for anything with more
      # than one Gateway instance (validate_for_production requires it).
      RATE_LIMIT_BACKEND: "${RATE_LIMIT_BACKEND:-memory}"
      # Every other secret in this file is `${VAR:-}` — overridable, empty
      # by default. This one still needs a harmless non-empty default so the
      # dev stack works with zero setup, but it must never be the value any
      # real deployment actually runs with — set SERVICE_JWT_SECRET in your
      # environment/.env to override it. validate_for_production() refuses
      # to boot with INUMI_ENV=production while this default is still active.
      SERVICE_JWT_SECRET: "${SERVICE_JWT_SECRET:-dev-only-change-me-in-production}"
      SERVICE_JWT_ISSUER: inumi-internal
      GATEWAY_BASE_URL: http://gateway:8001
      EXECUTION_BASE_URL: http://execution:8002
      AGENT_BASE_URL: http://agent:8000
      CHANNELS_BASE_URL: http://channels:8003
      # LLM: keys are passed through from your shell environment. With none
      # set, the agent falls back to the deterministic offline planner.
      # `LLM_PROVIDER` unset/"" = auto-pick the first provider that has a key.
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # Task-complexity tiering (see agent.llm.registry.tier_model) — both
      # empty by default, so a zero-config deployment is unaffected.
      LLM_FAST_MODEL: "${LLM_FAST_MODEL:-}"
      LLM_STRONG_MODEL: "${LLM_STRONG_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    volumes:
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  execution:
    build:
      context: .
      args:
        SERVICE: execution
    environment:
      <<: *common-env
    ports:
      - "8002:8002"
    # Lets the execution container reach databases running on the host.
    # `host-gateway` resolves to the Docker daemon's own machine — under
    # Docker Desktop that IS Windows, but this stack also runs against a
    # Docker Engine installed natively inside WSL2, where `host-gateway`
    # only reaches the WSL2 VM itself, not the Windows host one hop further
    # out. WINDOWS_HOST_IP overrides the target for that case (see .env.example
    # for how to find it); Docker Desktop users can leave it unset.
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST_IP:-host-gateway}"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: *common-env
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      execution:
        condition: service_started

  agent:
    build:
      context: .
      args:
        SERVICE: agent
    environment:
      <<: *common-env
      # Proactive daily digest — off unless a destination channel is set
      # (then no scheduler or job is created at all). Only the agent
      # service gets these: it owns the orchestrator and holds no database
      # credential. See OPERATIONS.md's "Enabling the daily health digest".
      DAILY_REPORT_SLACK_CHANNEL: "${DAILY_REPORT_SLACK_CHANNEL:-}"
      DAILY_REPORT_HOUR_UTC: "${DAILY_REPORT_HOUR_UTC:-6}"
      DAILY_REPORT_SERVERS: "${DAILY_REPORT_SERVERS:-}"
      DAILY_REPORT_IDENTITY_CHANNEL: "${DAILY_REPORT_IDENTITY_CHANNEL:-dev}"
      DAILY_REPORT_IDENTITY_ACCOUNT: "${DAILY_REPORT_IDENTITY_ACCOUNT:-}"
      # Alert-triggered investigation — off unless a destination channel is
      # set, same one-switch shape as the digest above. See
      # `agent.alert_trigger` and ARCHITECTURE.md's "Alert-triggered
      # investigation". `ALERT_WEBHOOK_SECRET` itself is NOT needed here —
      # only Channels verifies the inbound signature; this service only
      # ever sees an already-verified request.
      ALERT_WEBHOOK_SLACK_CHANNEL: "${ALERT_WEBHOOK_SLACK_CHANNEL:-}"
      ALERT_WEBHOOK_IDENTITY_CHANNEL: "${ALERT_WEBHOOK_IDENTITY_CHANNEL:-dev}"
      ALERT_WEBHOOK_IDENTITY_ACCOUNT: "${ALERT_WEBHOOK_IDENTITY_ACCOUNT:-}"
      ALERT_WEBHOOK_COOLDOWN_SECONDS: "${ALERT_WEBHOOK_COOLDOWN_SECONDS:-900}"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - gateway

  channels:
    build:
      context: .
      args:
        SERVICE: channels
    environment:
      <<: *common-env
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      TEAMS_APP_ID: "${TEAMS_APP_ID:-}"
      TEAMS_APP_PASSWORD: "${TEAMS_APP_PASSWORD:-dev-teams-shared-token}"
      # `/webhooks/alerts`' one switch: unset here, the route refuses every
      # request outright (see channels.alerts.signature) rather than ever
      # treating an unconfigured webhook as trusted-by-default.
      ALERT_WEBHOOK_SECRET: "${ALERT_WEBHOOK_SECRET:-}"
    ports:
      - "8003:8003"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - agent

volumes:
  inumi-postgres-data:
