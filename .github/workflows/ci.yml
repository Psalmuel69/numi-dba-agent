name: CI

# Mirrors `make test` / `make security-test` / `make lint` exactly (see
# Makefile) — this workflow is deliberately just those same commands run on
# a clean checkout, not a separate definition of "passing" to drift out of
# sync with local dev. Runs on every push and PR against main; nothing here
# touches a real database, LLM API, or Slack/Teams endpoint (see
# TESTING.md's "Deterministic execution without 'mock mode'" and "Opt-in
# live tests" — RUN_LIVE_LLM_TESTS/RUN_LIVE_DB_TESTS are never set here).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch/PR supersedes the still-running check
# for the first — no point finishing a run whose result is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit + integration + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.13, not the "3.12" requires-python floor: this is the exact
      # version the whole suite has actually been run and passed against
      # throughout local development (verified 413 passed/24 skipped
      # repeatedly on 3.13.14) — no 3.12 interpreter has been available to
      # reproduce/diagnose against locally, so pinning CI to an untested
      # version and guessing blindly at a failure with no visible log
      # (Actions logs need a signed-in GitHub session to view, even on a
      # public repo) would be worse than testing the version actually
      # validated. requires-python = ">=3.12" is still honest — 3.13
      # satisfies it — but true 3.12 coverage is a known, open gap; add it
      # back (ideally as a second matrix entry, not a replacement) once
      # there's a way to actually debug a 3.12-specific failure here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # unixodbc-dev / default-libmysqlclient-dev: build prerequisites for
      # pyodbc and asyncmy (SQL Server / MySQL-MariaDB drivers) in case no
      # prebuilt wheel matches this runner — installed unconditionally
      # since the base package install (not just an opt-in extra) depends
      # on both, and neither driver is ever actually connected to in this
      # job (TESTING.md: real engines are exercised only by the opt-in,
      # never-run-here tests/e2e/test_live_databases.py).
      - name: Install system build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev default-libmysqlclient-dev

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # config/dev_credentials.yaml is gitignored (real values never
      # committed — see the Makefile's own `dev` target and README's Quick
      # Start) and does not exist on a fresh checkout. Found live: without
      # this, `tests/unit`+`tests/integration`'s collection crashes with
      # FileNotFoundError — several test modules import a service's
      # `create_app` factory, and each service's `app.py` has a
      # module-level `app = create_app()` (needed so `uvicorn
      # numi.execution.api.app:app` etc. can actually serve it) that
      # eagerly constructs `LocalDevCredentialProvider`, which reads this
      # file at construction time, not lazily. Reproduced exactly locally
      # (moving the file aside reproduces the identical "6 errors during
      # collection" pytest exit code 2) before landing on this fix — the
      # Python-version pin above was a red herring for this specific
      # failure, ruled out the same way.
      - name: Set up dev credentials fixture
        run: cp config/dev_credentials.example.yaml config/dev_credentials.yaml

      - name: Unit + integration tests
        run: python -m pytest tests/unit tests/integration -q

      - name: Security suite
        run: python -m pytest tests/security -q

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev default-libmysqlclient-dev

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check src tests

      - name: mypy
        run: python -m mypy src
